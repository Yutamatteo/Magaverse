<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>MagaCard — Scanner</title>
<link rel="icon" type="image/jpeg" href="../../assets/img/logo_maga.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Playfair+Display:wght@700&family=Outfit:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  .mc-wrap { max-width: 440px; }
  #qr-reader { border-radius: 16px; overflow: hidden; border: 1px solid var(--mc-border); margin-top: 4px; }
  .role-badge { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:999px;
    font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; }
  .role-badge.ingresso { background: var(--mc-cyan-soft); color: var(--mc-cyan); }
  .role-badge.bar { background: var(--mc-gold-soft); color: var(--mc-gold); }
  .result-card { background: var(--mc-row); border: 1px solid var(--mc-border-soft); border-radius:16px;
    padding:20px; margin-top:16px; text-align:center; }
  .result-card .nome { font-size:17px; font-weight:700; margin-bottom:6px; }
  .result-card .esito { font-size:14px; color: var(--mc-muted); }
  .result-card .esito.ok { color: var(--mc-cyan); }
  .result-card .esito.errore { color: #FF7A93; }
  .points-picker { display:flex; gap:8px; margin: 16px 0 4px; flex-wrap:wrap; }
  .points-picker button { width:auto; flex:1; min-width:64px; padding:12px 6px; margin:0;
    background: rgba(255,255,255,0.04); border:1px solid var(--mc-border); color: var(--mc-text); }
  .points-picker button.selected { border-color: var(--mc-gold); color: var(--mc-gold); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="mc-wrap">

  <div id="login-box" class="glass-card">
    <div class="mc-eyebrow"><span class="dot"></span>MagaCard Staff</div>
    <h1 class="mc-title">Scanner</h1>
    <p class="mc-sub">Accedi con il tuo account staff per iniziare a scansionare le card.</p>
    <label for="staff-email">Email</label>
    <input type="email" id="staff-email">
    <label for="staff-pass">Password</label>
    <input type="password" id="staff-pass">
    <button class="btn-primary" id="btn-login">Accedi</button>
    <div class="mc-msg" id="login-msg"></div>
  </div>

  <div id="mode-picker" class="glass-card hidden">
    <h1 class="mc-title">Scegli postazione</h1>
    <p class="mc-sub">Il tuo account può sostituire bar o ingresso. Quale postazione stai coprendo ora?</p>
    <div style="display:flex; gap:10px;">
      <button class="btn-primary" data-mode="ingresso" style="margin-top:0;">Ingresso</button>
      <button class="btn-primary" data-mode="bar" style="margin-top:0;">Bar</button>
    </div>
  </div>

  <div id="panel" class="glass-card hidden">
    <div class="mc-topbar">
      <span class="role-badge" id="role-badge"></span>
      <button class="btn-ghost" id="btn-logout">Esci</button>
    </div>

    <div id="scan-area">
      <p class="mc-sub" style="margin-bottom:8px;">Inquadra il QR della MagaCard.</p>
      <div id="qr-reader"></div>
    </div>

    <div id="result-area" class="hidden"></div>
  </div>

</div>

<script>
  // Sostituisci con i valori del tuo progetto Supabase
  const SUPABASE_URL = "https://dkzzmxsreaegjagqbdnh.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_1FjHMhqLPVCC50fguLVmyw_XNfbv_9Q";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let ruolo = null;
  let html5QrCode = null;
  let scansioneAttiva = false;

  const loginBox = document.getElementById('login-box');
  const panel = document.getElementById('panel');
  const loginMsg = document.getElementById('login-msg');
  const roleBadge = document.getElementById('role-badge');
  const scanArea = document.getElementById('scan-area');
  const resultArea = document.getElementById('result-area');

  document.getElementById('btn-login').addEventListener('click', async () => {
    const email = document.getElementById('staff-email').value.trim();
    const password = document.getElementById('staff-pass').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      loginMsg.textContent = 'Accesso non riuscito: ' + error.message;
      return;
    }

    ruolo = data.user.user_metadata?.ruolo;
    const ruoliValidi = ['bar', 'ingresso', 'admin', 'superadmin'];
    if (!ruoliValidi.includes(ruolo)) {
      loginMsg.textContent = 'Questo account non ha un ruolo assegnato. Contatta l\'amministratore.';
      await sb.auth.signOut();
      return;
    }

    loginMsg.textContent = '';

    if (ruolo === 'admin' || ruolo === 'superadmin') {
      // admin/superadmin possono sostituire bar o ingresso: scelgono la modalità
      loginBox.classList.add('hidden');
      document.getElementById('mode-picker').classList.remove('hidden');
      return;
    }

    avviaConRuolo(ruolo);
  });

  document.querySelectorAll('#mode-picker button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('mode-picker').classList.add('hidden');
      avviaConRuolo(btn.dataset.mode);
    });
  });

  function avviaConRuolo(modalita) {
    roleBadge.textContent = modalita === 'bar' ? 'Postazione Bar' : 'Postazione Ingresso';
    roleBadge.className = 'role-badge ' + modalita;
    ruolo = modalita;
    panel.classList.remove('hidden');
    avviaScanner();
  }

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await fermaScanner();
    await sb.auth.signOut();
    panel.classList.add('hidden');
    loginBox.classList.remove('hidden');
  });

  function avviaScanner() {
    scanArea.classList.remove('hidden');
    resultArea.classList.add('hidden');
    html5QrCode = new Html5Qrcode('qr-reader');
    scansioneAttiva = true;
    html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 240 },
      onScanSuccess,
      () => {} // errori di lettura frame-by-frame, si ignorano
    ).catch(err => {
      resultArea.classList.remove('hidden');
      resultArea.innerHTML = `<div class="result-card"><div class="esito errore">Impossibile accedere alla fotocamera: ${err}</div></div>`;
    });
  }

  async function fermaScanner() {
    if (html5QrCode && scansioneAttiva) {
      try { await html5QrCode.stop(); } catch (e) {}
      scansioneAttiva = false;
    }
  }

  async function onScanSuccess(decodedText) {
    if (!scansioneAttiva) return;
    scansioneAttiva = false;
    await html5QrCode.pause(true);
    scanArea.classList.add('hidden');

    if (ruolo === 'ingresso') {
      await gestisciIngresso(decodedText);
    } else {
      await gestisciBar(decodedText);
    }
  }

  async function gestisciIngresso(cardCode) {
    resultArea.classList.remove('hidden');
    resultArea.innerHTML = `<div class="result-card"><div class="esito">Verifica in corso...</div></div>`;

    const { data, error } = await sb.rpc('aggiungi_timbro', { p_card_code: cardCode });
    const esito = data?.[0]?.esito;

    let html = '';
    if (error || !esito) {
      html = `<div class="esito errore">Errore di connessione, riprova.</div>`;
    } else if (esito === 'card_non_trovata') {
      html = `<div class="esito errore">Card non trovata o non ancora attiva.</div>`;
    } else if (esito === 'gia_timbrato_oggi') {
      html = `<div class="esito errore">Timbro già assegnato oggi per questa card.</div>`;
    } else {
      const { timbri, livello } = data[0];
      html = `<div class="esito ok">Timbro assegnato ✓</div>
              <p style="margin-top:8px; font-size:14px;">Timbri: <b>${timbri}</b> · Livello: <b>${livello}</b></p>`;
      if (timbri === 0) {
        html += `<p style="margin-top:10px; color: var(--mc-gold); font-size:13.5px;">🎉 Livello raggiunto! Il premio è già visibile sulla card del cliente.</p>`;
      }
    }

    resultArea.innerHTML = `<div class="result-card">${html}</div>
      <button class="btn-primary" id="btn-prossima" style="margin-top:16px;">Scansiona la prossima</button>`;
    document.getElementById('btn-prossima').addEventListener('click', prossimaScan);
  }

  async function gestisciBar(cardCode) {
    resultArea.classList.remove('hidden');
    resultArea.innerHTML = `<div class="result-card"><div class="esito">Ricerca card...</div></div>`;

    const { data, error } = await sb.rpc('cerca_card', { p_card_code: cardCode });
    const risultato = data?.[0];

    if (error || !risultato || risultato.stato !== 'attiva') {
      resultArea.innerHTML = `<div class="result-card"><div class="esito errore">Card non trovata o non ancora attiva.</div></div>
        <button class="btn-primary" id="btn-prossima" style="margin-top:16px;">Scansiona la prossima</button>`;
      document.getElementById('btn-prossima').addEventListener('click', prossimaScan);
      return;
    }

    resultArea.innerHTML = `
      <div class="result-card">
        <div class="nome">${risultato.nome} ${risultato.cognome}</div>
        <p class="esito">Punti attuali: <b>${risultato.punti_totali}</b></p>
        <div class="points-picker" id="points-picker">
          <button data-val="5">+5</button>
          <button data-val="10">+10</button>
          <button data-val="20">+20</button>
        </div>
        <label for="punti-custom">Oppure valore personalizzato</label>
        <input type="text" id="punti-custom" placeholder="Es. 15">
        <button class="btn-primary" id="btn-conferma-punti">Conferma</button>
      </div>
    `;

    let selezionati = null;
    document.querySelectorAll('#points-picker button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#points-picker button').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selezionati = parseInt(btn.dataset.val, 10);
        document.getElementById('punti-custom').value = '';
      });
    });

    document.getElementById('btn-conferma-punti').addEventListener('click', async () => {
      const custom = document.getElementById('punti-custom').value.trim();
      const punti = custom ? parseInt(custom, 10) : selezionati;
      if (!punti || punti <= 0) {
        alert('Scegli o inserisci un numero di punti valido.');
        return;
      }
      await confermaPunti(cardCode, punti);
    });
  }

  async function confermaPunti(cardCode, punti) {
    resultArea.innerHTML = `<div class="result-card"><div class="esito">Assegnazione in corso...</div></div>`;
    const { data, error } = await sb.rpc('aggiungi_punti', { p_card_code: cardCode, p_punti: punti });
    const esito = data?.[0]?.esito;

    let html = '';
    if (error || !esito) {
      html = `<div class="esito errore">Errore di connessione, riprova.</div>`;
    } else if (esito === 'card_non_trovata') {
      html = `<div class="esito errore">Card non trovata o non ancora attiva.</div>`;
    } else if (esito === 'valore_non_valido') {
      html = `<div class="esito errore">Valore punti non valido.</div>`;
    } else {
      html = `<div class="esito ok">+${punti} punti assegnati ✓</div>
              <p style="margin-top:8px; font-size:14px;">Totale punti: <b>${data[0].punti_totali}</b></p>`;
    }

    resultArea.innerHTML = `<div class="result-card">${html}</div>
      <button class="btn-primary" id="btn-prossima" style="margin-top:16px;">Scansiona la prossima</button>`;
    document.getElementById('btn-prossima').addEventListener('click', prossimaScan);
  }

  async function prossimaScan() {
    resultArea.classList.add('hidden');
    scanArea.classList.remove('hidden');
    scansioneAttiva = true;
    await html5QrCode.resume();
  }
</script>
</body>
</html>
