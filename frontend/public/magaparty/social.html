<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Social – MAGA REPUBLIC | Magaparty</title>
    <meta name="description" content="Seguici su Instagram, TikTok e Telegram per gli aggiornamenti Maga Republic.">
    <meta property="og:title" content="Social – MAGA REPUBLIC | Magaparty">
    <meta property="og:image" content="logo_maga.jpg">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/png" href="logo_maga.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="social">
<main id="page-main">

    <div class="animate-fade-in" data-testid="page-social">
        <div class="text-center mb-8">
            <h2 class="brutalist text-3xl tracking-tighter uppercase sunset-title">Social</h2>
            <p class="text-[10px] text-gray-500 tracking-[0.2em] uppercase mt-2">Unisciti alla community</p>
        </div>
        <div class="desktop-3col">
            <a href="https://www.instagram.com/_magaparty" target="_blank" data-testid="social-instagram"
               class="glass-card p-5 border-l-4 flex justify-between items-center hover:scale-[1.02] transition-all cursor-pointer"
               style="border-left-color:var(--sunset-coral); background:rgba(255,140,90,0.05)">
                <div>
                    <h4 class="font-bold text-sm text-white">Instagram</h4>
                    <p class="text-[10px] uppercase tracking-wider mt-1" style="color:var(--sunset-coral)">Foto &amp; Aggiornamenti</p>
                </div>
                <span class="text-3xl" style="color:var(--sunset-coral)"><i class="fa-brands fa-instagram"></i></span>
            </a>
            <a href="https://tiktok.com/@_magaparty" target="_blank" data-testid="social-tiktok"
               class="glass-card p-5 border-l-4 border-l-white bg-white/5 flex justify-between items-center hover:bg-white/10 hover:scale-[1.02] transition-all cursor-pointer">
                <div>
                    <h4 class="font-bold text-sm text-white">TikTok</h4>
                    <p class="text-[10px] uppercase tracking-wider text-gray-300 mt-1">Video &amp; Trend</p>
                </div>
                <span class="text-3xl text-white"><i class="fa-brands fa-tiktok"></i></span>
            </a>
            <a href="https://t.me/MAGAPART" target="_blank" data-testid="social-telegram"
               class="glass-card p-5 border-l-4 flex justify-between items-center hover:scale-[1.02] transition-all cursor-pointer"
               style="border-left-color:var(--sunset-teal); background:rgba(42,191,176,0.05)">
                <div>
                    <h4 class="font-bold text-sm text-white">Telegram</h4>
                    <p class="text-[10px] uppercase tracking-wider mt-1" style="color:var(--sunset-teal)">Info &amp; Photo Dump</p>
                </div>
                <span class="text-3xl" style="color:var(--sunset-teal)"><i class="fa-brands fa-telegram"></i></span>
            </a>
        </div>
    </div>

</main>
<script src="assets/app.js"></script>
</body>
</html>
