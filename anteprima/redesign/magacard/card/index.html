<!DOCTYPE html>
<html lang="it">
<head>
<meta name="robots" content="noindex, nofollow">
<script>/* ANTEPRIMA: blocca le scritture verso Supabase */(function(){var f=window.fetch;window.fetch=function(u,o){var s=String(u&&u.url||u);if(/supabase\.co/.test(s)&&o&&o.method&&o.method!=='GET'){console.warn('Anteprima: invio bloccato',s);return Promise.reject(new Error('Anteprima: invio disattivato'))}return f.apply(this,arguments)}})();</script>
<style>@view-transition{navigation:auto}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La tua MagaCard</title>
<link rel="icon" type="image/png" sizes="32x32" href="/anteprima/redesign/assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="/anteprima/redesign/assets/img/favicon-180.png">
<link rel="preload" href="/anteprima/redesign/assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="../../assets/storymap.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js" integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
<script src="../../assets/storymap.js" defer></script>
<style>
  :root{
    --sm-accent: #FF2E92;
    --sm-accent-2: #FFC145;
    --sm-good: #22D3EE;
    --sm-bg: #0B0712;
    --sm-surface: #17101F;
    --sm-surface-2: #1E1628;
    --sm-line: rgba(255,240,250,0.08);
    --sm-text: #F5F0FA;
    --sm-muted: #9C90AE;
    --sm-font-display: 'Archivo Black', serif;
    --sm-font-body: 'Outfit', system-ui, sans-serif;
  }
</style>
<link rel="stylesheet" href="/anteprima/redesign/assets/maga-base.css">
<link rel="stylesheet" href="/anteprima/redesign/assets/transizioni.css">
<link rel="stylesheet" href="/anteprima/redesign/assets/motion.css">
<link rel="stylesheet" href="../assets/tessera.css">
<meta name="theme-color" content="#0B0712">
</head>
<body><div style="position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:99999;background:#FFC23D;color:#0E1224;font:600 12px/1.3 system-ui,sans-serif;padding:6px 12px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.35);white-space:nowrap;pointer-events:none;opacity:.92">Anteprima · i form non inviano dati</div>
<h1 class="mv-sr">La tua MagaCard</h1>
<div class="mc-wrap tc-pagina">
  <div id="app"><div class="tc-carica" role="status"><span></span>Carico la tua MagaCard…</div></div>
</div>

<script>
  // Sostituisci con i valori del tuo progetto Supabase
  const SUPABASE_URL = "https://dkzzmxsreaegjagqbdnh.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_1FjHMhqLPVCC50fguLVmyw_XNfbv_9Q";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const app = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  async function carica() {
    if (!code) {
      app.innerHTML = '<div class="tc-vuoto"><strong>Manca il codice della tessera nel link.</strong><span>Apri il link che ti è arrivato per email, o chiedilo allo staff.</span><a class="tc-vuoto-link" href="/anteprima/redesign/magacard/">Richiedi la MagaCard</a></div>';
      return;
    }

    const { data, error } = await sb
      .from('magacard_pubblica')
      .select('nome, cognome, card_code, punti_totali, timbri, livello, stato')
      .eq('card_code', code)
      .single();

    if (error || !data) {
      app.innerHTML = '<div class="tc-vuoto"><strong>Tessera non trovata.</strong><span>Controlla il link o chiedi allo staff alla prossima serata.</span><a class="tc-vuoto-link" href="/anteprima/redesign/magacard/">Richiedi la MagaCard</a></div>';
      return;
    }

    const { data: premio } = await sb
      .from('magacard_premi_pubblica')
      .select('codice_premio, livello_raggiunto, stato, creato_il')
      .eq('card_code', code)
      .order('creato_il', { ascending: false })
      .limit(1)
      .maybeSingle();

    const premioDisponibile = premio && premio.stato === 'da_riscattare';

    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
    const timbri = Math.max(0, parseInt(data.timbri, 10) || 0);
    const punti = Math.max(0, parseInt(data.punti_totali, 10) || 0);
    const livello = esc(data.livello);
    const cerchi = Array.from({ length: 5 }, (_, k) => '<i' + (k < (timbri % 5 || (timbri && 5)) ? ' class="pieno"' : '') + ' style="--n:' + k + '"></i>').join('');

    app.innerHTML = `
      <p class="tc-sopra">La tua MagaCard</p>
      <div class="tc-tessera" id="tessera" aria-label="MagaCard di ${esc(data.nome)} ${esc(data.cognome)}, livello ${livello}">
        <div class="tc-corpo">
          <div class="tc-riga">
            <span class="tc-marca">MagaCard</span>
            <span class="tc-livello">Livello ${livello}</span>
          </div>
          <div class="tc-nome">${esc(data.nome)}<br>${esc(data.cognome)}</div>
          <div class="tc-riga tc-basso">
            <span class="tc-timbri" aria-hidden="true">${cerchi}</span>
            <span class="tc-codice">#${esc(data.card_code)}</span>
          </div>
          <span class="tc-riflesso" aria-hidden="true"></span>
        </div>
      </div>

      <dl class="tc-numeri">
        <div><dt>Punti</dt><dd>${punti}</dd></div>
        <div><dt>Timbri</dt><dd>${timbri}</dd></div>
      </dl>

      ${premioDisponibile ? `
      <div class="tc-premio" role="status">
        <strong>Premio disponibile</strong>
        <span>Mostra questa card allo staff per riscattarlo.</span>
      </div>` : ''}

      <div class="tc-qr">
        <div class="qr-wrap" id="qr"></div>
        <p>Mostra questo QR allo staff a ogni serata: ricevi punti e un timbro.</p>
      </div>
      <p class="tc-home">Aggiungi questa pagina alla schermata Home per riaprirla come un'app.</p>
    `;

    // la tessera segue il dito o il mouse
    const t = document.getElementById('tessera');
    const muovi = (x, y) => {
      const r = t.getBoundingClientRect();
      const px = Math.min(1, Math.max(0, (x - r.left) / r.width)), py = Math.min(1, Math.max(0, (y - r.top) / r.height));
      t.style.setProperty('--rx', ((0.5 - py) * 14).toFixed(2));
      t.style.setProperty('--ry', ((px - 0.5) * 18).toFixed(2));
      t.style.setProperty('--mx', px.toFixed(3)); t.style.setProperty('--my', py.toFixed(3));
    };
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      t.addEventListener('pointermove', (e) => { t.classList.add('in-mano'); muovi(e.clientX, e.clientY); });
      t.addEventListener('pointerleave', () => { t.classList.remove('in-mano'); ['--rx','--ry'].forEach(v => t.style.setProperty(v, 0)); t.style.setProperty('--mx', .5); t.style.setProperty('--my', .3); });
      requestAnimationFrame(() => t.classList.add('entra'));
    } else { t.classList.add('entra'); }

    new QRCode(document.getElementById('qr'), {
      text: data.card_code,
      width: 200,
      height: 200,
      colorDark: '#170F26',
      colorLight: '#ffffff',
    });
  }

  carica();
</script>
</body>
</html>
