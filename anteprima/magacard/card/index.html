<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La tua MagaCard</title>
<link rel="icon" type="image/jpeg" href="../../../assets/img/logo_maga.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../magacard/assets/styles.css">
<link rel="stylesheet" href="../../../assets/storymap.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../../../assets/storymap.js" defer></script>
<style>
  :root{
    --sm-accent: #FF2E92;
    --sm-accent-2: #FFC145;
    --sm-good: #22D3EE;
    --sm-bg: #0B0712;
    --sm-surface: #17101F;
    --sm-surface-2: #1E1628;
    --sm-line: rgba(255,240,250,0.08);
    --sm-text: #F5F0FA;
    --sm-muted: #9C90AE;
    --sm-font-display: 'Archivo Black', serif;
    --sm-font-body: 'Outfit', system-ui, sans-serif;
  }
</style>
</head>
<body>
<div class="mc-wrap reveal">
  <div id="app"><div class="mc-empty">Caricamento della tua MagaCard...</div></div>
</div>

<script>
  // Sostituisci con i valori del tuo progetto Supabase
  const SUPABASE_URL = "https://dkzzmxsreaegjagqbdnh.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_1FjHMhqLPVCC50fguLVmyw_XNfbv_9Q";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const app = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');

  async function carica() {
    if (!code) {
      app.innerHTML = '<div class="glass-card"><div class="mc-empty">Nessun codice card nel link.<br>Chiedi allo staff il link corretto.</div></div>';
      return;
    }

    const { data, error } = await sb
      .from('magacard_pubblica')
      .select('nome, cognome, card_code, punti_totali, timbri, livello, stato')
      .eq('card_code', code)
      .single();

    if (error || !data) {
      app.innerHTML = '<div class="glass-card"><div class="mc-empty">Card non trovata.<br>Controlla il link o chiedi allo staff.</div></div>';
      return;
    }

    const { data: premio } = await sb
      .from('magacard_premi_pubblica')
      .select('codice_premio, livello_raggiunto, stato, creato_il')
      .eq('card_code', code)
      .order('creato_il', { ascending: false })
      .limit(1)
      .maybeSingle();

    const premioDisponibile = premio && premio.stato === 'da_riscattare';

    app.innerHTML = `
      <div class="ticket-card">
        <div class="mc-top">
          <div class="mc-brand brutalist">MAGACARD</div>
          <div class="badge active" style="margin:0;">Livello ${data.livello}</div>
        </div>
        <div class="mc-nome">${data.nome} ${data.cognome}</div>
        <div class="mc-code">#${data.card_code}</div>
        <div class="ticket-perforation"></div>
        <div class="mc-stats">
          <div class="mc-stat"><div class="n">${data.punti_totali}</div><div class="l">Punti</div></div>
          <div class="mc-stat"><div class="n">${data.timbri}</div><div class="l">Timbri</div></div>
        </div>
        ${premioDisponibile ? `
        <div style="margin-top:16px; background: var(--mc-gold-soft); border: 1px solid rgba(255,193,69,0.35);
                    border-radius:14px; padding:14px 16px; position:relative; z-index:1;">
          <div style="color: var(--mc-gold); font-weight:700; font-size:13.5px;">🎉 Premio disponibile!</div>
          <div style="color: var(--mc-muted); font-size:12.5px; margin-top:4px;">
            Mostra questa card allo staff per riscattarlo.
          </div>
        </div>` : ''}
        <div class="qr-wrap" id="qr" style="margin-top:18px;"></div>
        <div class="mc-hint">Mostra questo QR allo staff per ricevere punti e timbri alle serate.<br>Aggiungi questa pagina alla schermata Home per riaprirla come un'app.</div>
      </div>
    `;

    new QRCode(document.getElementById('qr'), {
      text: data.card_code,
      width: 180,
      height: 180,
      colorDark: '#170F26',
      colorLight: '#ffffff',
    });
  }

  carica();
</script>
<a href="../../index.html" class="sm-preview-ribbon">● Anteprima — non pubblica</a>
</body>
</html>
