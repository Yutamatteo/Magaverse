<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>MAREA — accesso staff</title>
<link rel="icon" type="image/jpeg" href="../../logo_maga.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Outfit:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body { align-items: flex-start; max-width: 480px; margin: 0 auto; border-left:1px solid var(--night-border); border-right:1px solid var(--night-border); }
  .wrap { padding: 24px 20px 60px; }
  .eyebrow { display:flex; align-items:center; gap:8px; font-size:10px; text-transform:uppercase; letter-spacing:0.2em; color:#8A7B6E; margin-bottom:6px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--sunset-coral); animation:pulse 1.5s infinite; }
  .title { font-size:22px; margin:0 0 20px; }
  .glass-card { padding:20px; margin-bottom:16px; }
  label { display:block; font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:#8A7B6E; margin:12px 0 6px; }
  label:first-child { margin-top:0; }
  input[type=email], input[type=password], input[type=text] {
    width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--night-border); border-radius:12px;
    padding:12px 14px; color:#ECE3D8; font-family:inherit; font-size:13px; outline:none;
  }
  .btn-primary {
    width:100%; margin-top:16px; padding:13px; border:none; border-radius:999px; cursor:pointer;
    font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:0.15em;
    color:var(--night-surface); background:var(--sunset-orange); box-shadow:0 0 20px rgba(154,216,47,0.35);
  }
  .btn-ghost {
    padding:9px 16px; border-radius:999px; border:1px solid var(--night-border); background:transparent;
    color:#ECE3D8; font-size:10px; text-transform:uppercase; letter-spacing:0.12em; cursor:pointer;
  }
  .msg { font-size:11px; color:var(--sunset-coral); margin-top:10px; min-height:14px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  #qr-reader { border-radius:16px; overflow:hidden; border:1px solid var(--night-border); }
  .hidden { display:none !important; }
  .result-card { text-align:center; padding:24px; }
  .result-card .nome { font-size:18px; font-weight:700; margin-bottom:6px; color:#fff; }
  .result-card .esito { font-size:14px; }
  .result-card .esito.ok { color: var(--sunset-orange); }
  .result-card .esito.errore { color: var(--sunset-coral); }
  .result-card .esito.warn { color: var(--sunset-gold); }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow"><span class="dot"></span>Area riservata</div>
  <h1 class="title brutalist">MAREA · STAFF</h1>

  <!-- LOGIN -->
  <div class="glass-card neon-border-orange" id="login-box">
    <label for="staff-email">Email staff</label>
    <input type="email" id="staff-email" autocomplete="username">
    <label for="staff-pass">Password</label>
    <input type="password" id="staff-pass" autocomplete="current-password">
    <button class="btn-primary" id="btn-login">Accedi</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <!-- PANNELLO -->
  <div class="glass-card neon-border-orange hidden" id="panel">
    <div class="topbar">
      <span style="color:#8A7B6E; font-size:12px" id="staff-name"></span>
      <button class="btn-ghost" id="btn-logout">Esci</button>
    </div>

    <div id="scan-area">
      <p style="font-size:12px; color:#ECE3D8; margin-bottom:10px">Inquadra il QR ricevuto via email dall'ospite.</p>
      <div id="qr-reader"></div>
    </div>
    <div id="result-area" class="hidden"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://dkzzmxsreaegjagqbdnh.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_1FjHMhqLPVCC50fguLVmyw_XNfbv_9Q";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const OPZIONE_LABEL = { promo: '🔥 Promo (Lettino + Drink)', lettino: '☀️ Solo Lettino', base: '🎟️ Ingresso Base' };

  const loginBox = document.getElementById('login-box');
  const panel = document.getElementById('panel');
  const loginMsg = document.getElementById('login-msg');
  const scanArea = document.getElementById('scan-area');
  const resultArea = document.getElementById('result-area');
  let html5QrCode = null;
  let scansioneAttiva = false;

  document.getElementById('btn-login').addEventListener('click', async () => {
    const email = document.getElementById('staff-email').value.trim();
    const password = document.getElementById('staff-pass').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { loginMsg.textContent = 'Accesso non riuscito: ' + error.message; return; }

    const ruolo = data.user.user_metadata?.ruolo;
    if (!['marea', 'admin', 'superadmin'].includes(ruolo)) {
      loginMsg.textContent = "Questo account non ha accesso a Marea. Contatta l'amministratore.";
      await sb.auth.signOut();
      return;
    }

    loginMsg.textContent = '';
    document.getElementById('staff-name').textContent = data.user.email;
    loginBox.classList.add('hidden');
    panel.classList.remove('hidden');
    avviaScanner();
  });

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await fermaScanner();
    await sb.auth.signOut();
    panel.classList.add('hidden');
    loginBox.classList.remove('hidden');
    document.getElementById('staff-email').value = '';
    document.getElementById('staff-pass').value = '';
  });

  function avviaScanner() {
    scanArea.classList.remove('hidden');
    resultArea.classList.add('hidden');
    html5QrCode = new Html5Qrcode('qr-reader');
    scansioneAttiva = true;
    html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 240 },
      onScanSuccess,
      () => {}
    ).catch(err => {
      resultArea.classList.remove('hidden');
      resultArea.innerHTML = `<div class="result-card"><div class="esito errore">Impossibile accedere alla fotocamera: ${err}</div></div>`;
    });
  }

  async function fermaScanner() {
    if (html5QrCode && scansioneAttiva) {
      try { await html5QrCode.stop(); } catch (e) {}
      scansioneAttiva = false;
    }
  }

  async function onScanSuccess(qrToken) {
    if (!scansioneAttiva) return;
    scansioneAttiva = false;
    await html5QrCode.pause(true);
    scanArea.classList.add('hidden');
    resultArea.classList.remove('hidden');
    resultArea.innerHTML = `<div class="result-card"><div class="esito">Verifica in corso...</div></div>`;

    const { data, error } = await sb.rpc('valida_ingresso_marea', { p_qr_token: qrToken });
    const r = data?.[0];

    let html = '';
    if (error || !r) {
      html = `<div class="esito errore">Errore di connessione, riprova.</div>`;
    } else if (r.esito === 'non_trovato') {
      html = `<div class="esito errore">QR non valido o non riconosciuto.</div>`;
    } else if (r.esito === 'gia_usato') {
      html = `<div class="nome">${r.nome_capogruppo}</div>
              <div class="esito warn">⚠️ QR già utilizzato — accesso già avvenuto.</div>`;
    } else if (r.esito === 'annullata') {
      html = `<div class="esito errore">Prenotazione annullata.</div>`;
    } else if (r.esito === 'non_autorizzato') {
      html = `<div class="esito errore">Il tuo account non è autorizzato per questa postazione.</div>`;
    } else {
      html = `<div class="nome">${r.nome_capogruppo}</div>
              <div class="esito ok">✓ Accesso consentito</div>
              <p style="margin-top:8px; font-size:13px; color:#ECE3D8">${OPZIONE_LABEL[r.opzione] || r.opzione}</p>
              <p style="margin-top:4px; font-size:12px; color:#8A7B6E">Gruppo: ${r.composizione}</p>`;
    }

    resultArea.innerHTML = `<div class="result-card">${html}</div>
      <button class="btn-primary" id="btn-prossima">Scansiona il prossimo</button>`;
    document.getElementById('btn-prossima').addEventListener('click', async () => {
      resultArea.classList.add('hidden');
      scanArea.classList.remove('hidden');
      scansioneAttiva = true;
      await html5QrCode.resume();
    });
  }
</script>
</body>
</html>
